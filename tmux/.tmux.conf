set -g default-terminal "tmux-256color"

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %

bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file ~/.tmux.conf

bind -r m resize-pane -Z

unbind &
bind X confirm-before -p "kill window #W? (y/n)" kill-window

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set -g mouse on

set-option -g status-position top

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# better navigation

set -g @plugin "christoomey/vim-tmux-navigator"

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins

# set -g @plugin 'jimeh/tmux-themepack'
# set -g @themepack 'powerline/double/cyan'

set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 120

set -g status-left "#[fg=#{?client_prefix,##cba6f7,##181825},bg=default]#[bg=#{?client_prefix,##cba6f7,##181825}]#[fg=#{?client_prefix,##11111b,##a6e3a1}] #[fg=#{?client_prefix,##11111b,##cdd6f4},bold]#S#[nobold]#[fg=#{?client_prefix,##cba6f7,##181825},bg=default] "
set -g window-status-separator " "
set -g window-status-format "#[fg=#181825,bg=default]#[bg=#181825]#[fg=#6c7086]#I #W#[fg=#181825,bg=default]"
set -g window-status-current-format "#[fg=#181825,bg=default]#[bg=#181825]#[fg=#a6e3a1,bold]#I #W#{?window_zoomed_flag, Z,}#[fg=#181825,bg=default]"
set -g status-right "#[fg=#181825,bg=default]#[bg=#181825]#[fg=#fab387] #[fg=#cdd6f4]#{s|/home/ankitey|~|:pane_current_path}#[fg=#181825,bg=default] #[fg=#181825,bg=default]#[bg=#181825]#[fg=#f38ba8] #[fg=#cdd6f4]%H:%M#[fg=#181825,bg=default]"

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=#181825,fg=#cdd6f4"
set -g message-command-style "bg=#181825,fg=#cdd6f4"
set -g mode-style "bg=#45475a,fg=#cdd6f4"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

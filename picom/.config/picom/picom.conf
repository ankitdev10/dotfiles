backend = "glx";
vsync = true;

opacity-rule = [
    "90:class_g = 'i3'",
    "80:class_g = 'URxvt'",
    "70:class_g = 'Firefox'"
];

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

blur: {
    method = "dual_kawase";
    strength = 4;
};
blur-background = true;
blur-background-frame = true;
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'",
    "class_g = 'flameshot'"
];

shadow = true;
shadow-radius = 28;
shadow-offset-x = -28;
shadow-offset-y = -28;
shadow-opacity = 0.9;
shadow-color = "#cba6f7";
shadow-exclude = [
    "!focused",
    "class_g = 'Polybar'",
    "class_g = 'Rofi'",
    "class_g = 'Dunst'",
    "class_g = 'Gsimplecal'",
    "class_g = 'flameshot'",
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "window_type = 'menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'popup_menu'",
    "window_type = 'tooltip'",
    "_GTK_FRAME_EXTENTS@"
];

inactive-dim = 0.2;
mark-ovredir-focused = true;
use-ewmh-active-win = true;
focus-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'Rofi'",
    "class_g = 'Dunst'",
    "class_g = 'Gsimplecal'",
    "class_g = 'flameshot'",
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

animations = (
    {
        triggers = [ "open", "show" ];
        preset = "appear";
        scale = 0.92;
        duration = 0.22;
    },
    {
        triggers = [ "close", "hide" ];
        preset = "disappear";
        scale = 0.92;
        duration = 0.16;
    },
    {
        triggers = [ "geometry" ];
        preset = "geometry-change";
        duration = 0.2;
    }
);

corner-radius = 10;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'",
    "class_g = 'Rofi'",
    "class_g = 'Dunst'",
    "class_g = 'flameshot'"
];

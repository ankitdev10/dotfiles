backend = "glx"
vsync = true
glx-use-copysubbuffer-mesa = true

glx-copy-from-front = true
glx-swap-method = 2
xrender-sync = true
xrender-sync-fence = true

# Enable transparency and blur
opacity-rule = [
    "90:class_g = 'i3'",  # Example rule for i3 windows
    "80:class_g = 'URxvt'",  # Example rule for URxvt terminals
    "70:class_g = 'Firefox'"  # Example rule for Firefox windows
]


# fading
# Enable fading
fading = true
fade-in-step = 0.03
fade-out-step = 0.03

# Enable blur with a radius
blur:
    {
        method = "dual_kawase";
        strength = 4;
    }

blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'",
    "class_g = 'flameshot'"
];

# General settings for improved visual effects
shadow = true
shadow-radius = 28
shadow-offset-x = -28
shadow-offset-y = -28
shadow-opacity = 0.9
shadow-color = "#cba6f7"
shadow-exclude = [
    "!focused",
    "class_g = 'Polybar'",
    "class_g = 'Rofi'",
    "class_g = 'Dunst'",
    "class_g = 'Gsimplecal'",
    "class_g = 'flameshot'",
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "window_type = 'menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'popup_menu'",
    "window_type = 'tooltip'",
    "_GTK_FRAME_EXTENTS@:c"
];

# Optional: Apply blur effect to background and window frame
blur-background = true
blur-background-frame = true


# rounded corners

# corner-radius = 10



# opcacity
# inactive-opacity = 0.8;
# active-opacity = 0.9

inactive-dim = 0.2;
mark-ovredir-focused = true;
use-ewmh-active-win = true;
focus-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'Rofi'",
    "class_g = 'Dunst'",
    "class_g = 'Gsimplecal'",
    "class_g = 'flameshot'",
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

format = "$directory$git_branch$git_status$nodejs$python$rust$golang$php$cmd_duration$fill$time$line_break$character"
add_newline = true

[directory]
format = "[](fg:#181825)[ ](bg:#181825 fg:#fab387)[$path](bg:#181825 fg:#cdd6f4)[$read_only](bg:#181825 fg:#f38ba8)[](fg:#181825) "
truncation_length = 3
truncation_symbol = "…/"
read_only = " "

[git_branch]
symbol = " "
format = "[](fg:#181825)[$symbol](bg:#181825 fg:#a6e3a1)[$branch](bg:#181825 fg:#cdd6f4)[](fg:#181825) "

[git_status]
format = "([](fg:#181825)[$all_status$ahead_behind](bg:#181825 fg:#f9e2af)[](fg:#181825) )"

[nodejs]
symbol = " "
format = "[](fg:#181825)[$symbol](bg:#181825 fg:#a6e3a1)[$version](bg:#181825 fg:#cdd6f4)[](fg:#181825) "

[python]
symbol = " "
format = "[](fg:#181825)[$symbol](bg:#181825 fg:#f9e2af)[$version](bg:#181825 fg:#cdd6f4)[](fg:#181825) "

[rust]
symbol = " "
format = "[](fg:#181825)[$symbol](bg:#181825 fg:#fab387)[$version](bg:#181825 fg:#cdd6f4)[](fg:#181825) "

[golang]
symbol = " "
format = "[](fg:#181825)[$symbol](bg:#181825 fg:#89dceb)[$version](bg:#181825 fg:#cdd6f4)[](fg:#181825) "

[php]
symbol = " "
format = "[](fg:#181825)[$symbol](bg:#181825 fg:#b4befe)[$version](bg:#181825 fg:#cdd6f4)[](fg:#181825) "

[cmd_duration]
min_time = 2000
format = "[](fg:#181825)[ ](bg:#181825 fg:#f9e2af)[$duration](bg:#181825 fg:#cdd6f4)[](fg:#181825) "

[time]
disabled = false
time_format = "%H:%M"
format = "[](fg:#181825)[ ](bg:#181825 fg:#f38ba8)[$time](bg:#181825 fg:#cdd6f4)[](fg:#181825)"

[character]
success_symbol = "[❯](bold #cba6f7)"
error_symbol = "[❯](bold #f38ba8)"
vimcmd_symbol = "[❮](bold #a6e3a1)"

[fill]
symbol = " "
